<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FleetOps — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- Header of the login page -->
        <div class="login-header">

    <h1 class="login-title">
        FleetOps
        <span class="login-subtitle">Management Dashboard</span>
    </h1>

</div>


        <div id="loginError" style="display:none;background:#fbe9e7;color:#c4433b;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;"></div>

        <form action="../Backend/auth/login_process.php" method="POST">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button type="submit">
                Login
            </button>


        </form>

    </div>

</div>


<script>
  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  if (err) {
    const box = document.getElementById('loginError');
    box.textContent = err;
    box.style.display = 'block';
  }
</script>
</body>
</html>
